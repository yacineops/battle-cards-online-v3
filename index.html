:root{
  --bg1:#0f2027;
  --bg2:#203a43;
  --bg3:#2c5364;
  --surface:#122b3a;
  --surface-2:#1e3a52;
  --text:#fff;
  --muted:#b0c4de;
  --line:rgba(255,255,255,.14);
  --safe-area-inset-top:0px;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#0f2027;
    --surface-2:#1e3a52;
    --text:#fff;
    --muted:#b0c4de;
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

/* Never a white page: the page background is the game gradient even
   before React mounts, so a slow / failed first paint is dark, not blank. */

html,body{
  margin:0;
  padding:0;
  background:#0f2027
}

#root{
  min-height:100dvh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg3))
}

body{
  background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg3));
  background-attachment:fixed;
  color:var(--text);
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  overflow-x:clip
}

button{
  font-family:inherit
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 18px;
  margin:5px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg,#1976d2,#2196f3);
  color:white;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  transition:.2s
}

.btn:active{
  transform:scale(.94)
}

.btn:hover{
  filter:brightness(1.15)
}

.btn.secondary{
  background:linear-gradient(135deg,#455a64,#607d8b)
}

.btn.gold{
  background:linear-gradient(135deg,#ff8f00,#ffc107);
  color:#222
}

.btn.danger{
  background:linear-gradient(135deg,#c62828,#ef5350)
}

.btn.online-blue{
  background:linear-gradient(135deg,#1565c0,#2196f3);
  width:100%;
  margin:12px 0 0;
  font-size:18px;
  padding:16px
}

.iconBtn{
  width:44px;
  height:44px;
  padding:0;
  font-size:20px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:0;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center
}

.player.current{
  border-color:#00e676!important;
  box-shadow:0 0 0 2px rgba(0,230,118,.4),0 0 18px rgba(0,230,118,.35);
  background:rgba(0,230,118,.08)!important
}

.player.targetSelectable{
  border-color:#ff9800!important;
  cursor:pointer;
  animation:pulse 1s infinite
}

@keyframes pulse{
  0%,100%{
    box-shadow:0 0 4px rgba(255,152,0,.3)
  }

  50%{
    box-shadow:0 0 16px rgba(255,152,0,.9)
  }
}

.card.doubleChoice,.card.replaySelectable{
  animation:pulse 1s infinite
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:99px;
  font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:.3s;
  z-index:1000;
  max-width:90%;
  font-size:14px;
  text-align:center
}

.toast.show{
  transform:translateX(-50%) translateY(0)
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  z-index:1001;
  padding:20px 16px 16px;
  pointer-events:auto
}

.modalBox{
  background:#1e2a38;
  border-radius:20px;
  padding:22px;
  width:100%;
  max-width:360px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation:pop .3s ease;
  color:#fff;
  pointer-events:auto
}

.modalBox h3{
  margin:0 0 8px;
  font-size:20px
}

.modalBox p{
  color:#b0c4de;
  font-size:14px;
  line-height:1.6;
  margin:0 0 16px
}

.bigCardOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:1500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
</style>
