<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>بطاقات الأبطال - Battle Cards</title>
    <style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0f2027}
body{background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);background-attachment:fixed;color:#fff;font-family:'Segoe UI',Tahoma,Arial,sans-serif;overflow-x:hidden}
#root{min-height:100dvh}
.btn{border:0;border-radius:14px;padding:13px 18px;margin:5px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#1976d2,#2196f3);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.btn:active{transform:scale(.94)} .btn.secondary{background:linear-gradient(135deg,#455a64,#607d8b)} .btn.gold{background:linear-gradient(135deg,#ff8f00,#ffc107);color:#222} .btn.danger{background:linear-gradient(135deg,#c62828,#ef5350)} .btn.online-blue{background:linear-gradient(135deg,#1565c0,#2196f3);width:100%;margin:12px 0 0;font-size:18px;padding:16px}
.iconBtn{width:44px;height:44px;padding:0;font-size:20px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#222;color:#fff;padding:12px 18px;border-radius:99px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.3s;z-index:1000;max-width:90%;font-size:14px;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;z-index:1001;padding:20px 16px}
.modalBox{background:#1e2a38;border-radius:20px;padding:22px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modalBox h3{margin:0 0 8px;font-size:20px} .modalBox p{color:#b0c4de;font-size:14px;line-height:1.6;margin:0 0 16px}
.bigCardOverlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1500;display:flex;align-items:center;justify-content:center;padding:20px}
.player.current{border-color:#00e676!important;box-shadow:0 0 0 2px rgba(0,230,118,.4),0 0 18px rgba(0,230,118,.35)}
.player.targetSelectable{border-color:#ff9800!important;cursor:pointer;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(255,152,0,.3)}50%{box-shadow:0 0 16px rgba(255,152,0,.9)}}
@keyframes pop{0%{transform:scale(.92)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes bigIn{0%{transform:scale(.2) rotate(-18deg);opacity:0}60%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1)}}
/* ===== FIX: CARDS BIG LIKE OFFLINE ===== */
.cards-grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(9,1fr);gap:6px;margin:0;min-height:0;min-width:0}
.card{height:auto;min-height:0;border-radius:12px;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.card.opened{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;overflow:hidden}
.card .back{background:linear-gradient(135deg,#263f59,#3a5a7c);border:2px solid #5a7d9c;font-size:26px}
.card .front{transform:rotateY(180deg);border:2px solid #fff;color:#111}
.card .front .icon{font-size:26px;line-height:1}
.card .front .lbl{font-size:11px;font-weight:800;line-height:1.15;padding:0 4px;text-align:center}
input{outline:none}
</style>

  <body>
    <div id="root">
    </div>
    <script>
/* ============ Battle Cards - FIXED index (V7 client) ============
 FIX 1: Scores NEVER calculated locally in online mode. Server is source of truth.
 FIX 2: Card reveal: card_picked -> mark opened for EVERYONE (no if by===myId check).
 FIX 3: Cards BIG: grid 5x9, same size offline & online, no tiny cards.
 FIX 4: WS URL: same host when deployed together, else Render WS.
 FIX 5: Target: client sends ABSOLUTE server id (targetBase=1), server converts.
*/
const AVATARS=["🦸","🦹","🧑‍🚀","🦸‍♀️","🦹‍♂️","🧙","🦸‍♂️","😎","🦁","🦄","🐉","👽"];
const CARD_INFO={
 points:(v)=>({label:v>0?`نقاط +${v}`:`نقاط ${v}`,icon:v>0?"💰":"💸"}),
 nextLevel:{label:"الانتقال للمستوى التالي",icon:"🚪"}, reverse:{label:"قلب الاتجاه",icon:"🔄"}, skip:{label:"تخطي اللاعب",icon:"⏭️"},
 steal:{label:"سرقة 3 نقاط",icon:"💰"}, shield:{label:"درع النقاط",icon:"🛡️"}, replay:{label:"إعادة التفعيل",icon:"♻️"},
 bomb:{label:"خصم 3 نقاط",icon:"💣"}, shuffle:{label:"إعادة قلب البطاقات",icon:"🔄"}, reset:{label:"تصفير الجميع",icon:"🧹"},
 doubleChoice:{label:"اختيار مزدوج",icon:"🃏"}, exchange:{label:"تبادل النقاط",icon:"🔃"}, resetShield:{label:"حماية الرصيد",icon:"🔐"},
 resetPlayer:{label:"تصفير لاعب",icon:"💥"}, exchangePlayers:{label:"تبادل لاعبين",icon:"🔄"}, bombShield:{label:"درع القنبلة",icon:"🛡️"},
 stealShield:{label:"درع السرقة",icon:"🛡️"}, reflect:{label:"عكس الهجوم",icon:"🪞"}, doubleSelf:{label:"ضاعف رصيدك",icon:"✖️2"},
 doubleTarget:{label:"مضاعفة لاعب",icon:"🎯"}, freeze:{label:"تجميد لاعب",icon:"🧊"}, stealAll:{label:"سرقة أرصدة الخصوم",icon:"🦹"},
 reverseBalances:{label:"عكس أرصدة الخصوم",icon:"🔄"}, shieldSteal:{label:"درع ضد السرقة",icon:"🛡️"}, shieldReverse:{label:"درع ضد قلب الاتجاه",icon:"🛡️"},
 shieldSkip:{label:"درع ضد التخطي",icon:"🛡️"}, goldenShield:{label:"الدرع الذهبي",icon:"🏆"}, randomBalances:{label:"خلط النقاط",icon:"🎲"},
 bombAll:{label:"قنبلة الخصوم −5",icon:"💣"}, cancelShuffle:{label:"إلغاء القلب",icon:"🚫"}, cancelReplay:{label:"إلغاء إعادة التفعيل",icon:"🛑"},
 randomPoints:{label:"نقاط عشوائية",icon:"🎲"}
};
function infoFor(c){ if(!c) return {label:"?",icon:"⭐"}; if(c.type==="points") return CARD_INFO.points(c.value||0); return CARD_INFO[c.type]||{label:c.type,icon:"⭐"}; }
function deckFor(level){
  let cs=[]; const push=(t,v,a)=>{let c={type:t,opened:false}; if(v!=null)c.value=v; if(a!=null)c.amount=a; cs.push(c);};
  let vals = level===1?[1,1,1,3,3,3,5,5,5,10,10,10,-2,-2,-2,-5,-5,-5,-10]:level===2?[1,1,1,3,3,3,5,5,5,10,10,10,-2,-2,-2,-5,-5]:[1,1,1,3,3,3,5,5,5,10,10,10,-2,-2,-2,-5,-5,-5];
  vals.forEach(v=>push('points',v));
  let sp = level===1 ? [['nextLevel'],['reverse'],['reverse'],['skip'],['skip'],['steal',null,3],['steal',null,3],['shield'],['shield'],['replay'],['bomb',null,3],['bomb',null,3],['shuffle'],['reset'],['doubleChoice'],['exchange'],['resetShield'],['points',7],['points',4],['resetPlayer'],['exchangePlayers'],['bombShield'],['stealShield'],['reflect'],['doubleSelf'],['doubleTarget']] : level===2 ? [['nextLevel'],['doubleTarget'],['doubleSelf'],['reverse'],['skip'],['resetPlayer'],['exchange'],['exchangePlayers'],['freeze'],['reset'],['stealAll'],['reflect'],['steal',null,5],['replay'],['reverseBalances'],['shieldSteal'],['resetShield'],['shieldReverse'],['shieldSkip'],['goldenShield'],['doubleChoice'],['randomBalances'],['bombAll'],['cancelShuffle'],['cancelReplay'],['shuffle'],['nextLevel']] : [['doubleTarget'],['doubleSelf'],['reverse'],['skip'],['resetPlayer'],['exchange'],['exchangePlayers'],['freeze'],['reset'],['stealAll'],['reflect'],['steal',null,5],['replay'],['reverseBalances'],['shieldSteal'],['resetShield'],['shieldReverse'],['shieldSkip'],['goldenShield'],['doubleChoice'],['randomBalances'],['bombAll'],['cancelShuffle'],['cancelReplay'],['randomPoints'],['shuffle']];
  sp.forEach(s=>push(s[0],s[1],s[2]));
  while(cs.length<45) cs.push({type:'points',value:[1,3,5,-2][cs.length%4],opened:false});
  cs=cs.slice(0,45);
  for(let i=cs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)); [cs[i],cs[j]]=[cs[j],cs[i]];}
  return cs;
}
function freshPlayers(n,bot){
  let names=["الزعيم","الوحش","النجم","الأسطورة","الصاروخ","البرق","النمر","الصقر","القرش","التنين"];
  return Array.from({length:n},(_,i)=>({name:i===0?"أنت":(bot?"🤖 "+names[i-1]:(names[i-1]||("اللاعب "+(i+1)))),score:0,shield:0,bombShield:0,stealShield:0,resetShield:0,reflect:0,shieldReverse:0,shieldSkip:0,goldenShield:0,cancelShuffle:0,cancelReplay:0,freeze:0,avatar:AVATARS[i%AVATARS.length]}));
}
function shieldsText(p){ return [p.shield>0?`🛡️${p.shield>1?p.shield:""}`:"",p.goldenShield>0?"🏆":"",p.bombShield>0?"🧨":"",p.stealShield>0?"💰🛡️":"",p.resetShield>0?"🔐":"",p.reflect>0?"🪞":"",p.freeze>0?"🧊":""].filter(Boolean).join(" ")||"—"; }

let S = {
  screen:'home', mode:'offline', // offline | bot | online
  players:[], cards:[], level:1, direction:1, current:0,
  myIndex:0, online:false, bot:false,
  name:'اللاعب 1', playerCount:2, roomCode:'', roomInput:'',
  modal:null, confirm:null, toast:'', toastTimer:null,
  bigCard:null, targetMode:null, targetCardIndex:null, targetFirst:null,
  chat:[], chatOpen:false, chatText:'', seconds:15, timerId:null,
  ws:null, wsStatus:'idle', wsQueue:[], waitingPlayers:[], waitingCount:1, waitingTotal:2,
  doubleChoicePick:[], replayMode:false, error:''
};
function toast(msg){ S.toast=msg; render(); clearTimeout(S.toastTimer); S.toastTimer=setTimeout(()=>{S.toast=''; render();},2400); }
function wsUrl(){
  try{ if(window.location.protocol.startsWith('http')) return (window.location.protocol==='https:'?'wss://':'ws://')+window.location.host; }catch(e){}
  return 'wss://battle-cards-ws.onrender.com';
}
function wsConnect(){
  if(S.ws && (S.ws.readyState===WebSocket.OPEN||S.ws.readyState===WebSocket.CONNECTING)) return S.ws;
  S.wsStatus='connecting'; render();
  try{
    let ws=new WebSocket(wsUrl()); S.ws=ws;
    ws.onopen=()=>{ S.wsStatus='connected'; S.error=''; let q=[...S.wsQueue]; S.wsQueue=[]; q.forEach(m=>{try{ws.send(JSON.stringify(m))}catch(e){}}); render(); };
    ws.onmessage=(ev)=>{ try{ handleServer(JSON.parse(String(ev.data))); }catch(e){} };
    ws.onerror=()=>{ S.wsStatus='error'; S.error='تعذر الاتصال بالسيرفر - تحقق من Render'; render(); };
    ws.onclose=()=>{ S.wsStatus='closed'; if(S.online||S.modal==='searching'||S.modal==='waitingRoom'){ S.error='انقطع الاتصال بالسيرفر'; toast('⚠️ انقطع الاتصال بالسيرفر'); } render(); };
    return ws;
  }catch(e){ S.wsStatus='error'; return null; }
}
function wsSend(m){ let ws=S.ws; if(ws && ws.readyState===WebSocket.OPEN){ try{ws.send(JSON.stringify(m))}catch(e){} } else { S.wsQueue.push(m); wsConnect(); } }

function startLocal(n,bot){
  S.mode=bot?'bot':'offline'; S.bot=bot; S.online=false; S.myIndex=0;
  S.players=freshPlayers(n,bot); S.cards=deckFor(1); S.level=1; S.direction=1; S.current=0; S.seconds=15;
  S.targetMode=null; S.targetCardIndex=null; S.targetFirst=null; S.bigCard=null; S.confirm=null; S.modal=null;
  S.screen='game'; startLocalTimer(); render();
}
function startLocalTimer(){ clearInterval(S.timerId); if(S.online) return; S.seconds=15; S.timerId=setInterval(()=>{ if(S.screen!=='game'||S.online) return; S.seconds--; if(S.seconds<=0){ toast('⏱️ انتهى الوقت - تم تخطي الدور'); advanceLocal(1); S.seconds=15; } render(); },1000); }
function advanceLocal(steps){
  let left=steps||1, guard=0;
  while(left>0 && guard<30){ guard++; S.current = S.direction===1 ? (S.current+1)%S.players.length : (S.current-1+S.players.length)%S.players.length; let p=S.players[S.current]; if(p && p.freeze>0){ p.freeze--; left++; } left--; }
}
function checkEndLocal(){
  if(!S.cards.every(c=>c.opened)) return;
  clearInterval(S.timerId);
  let best=Math.max(...S.players.map(p=>p.score)); let win=S.players.filter(p=>p.score===best);
  S.winnerText = win.length===1 ? `🏆 الفائز هو ${win[0].name} برصيد ${best} نقطة` : `🏆 تعادل بين: ${win.map(p=>p.name).join(' و ')} برصيد ${best} نقطة`;
  S.screen='result'; render();
}
// Local effect (offline/bot only — NEVER used in online mode)
function applyLocalEffect(card, picker, target, first){
  let me=S.players[picker]; let t= target!=null?S.players[target]:null; let amt=card.amount!=null?card.amount:3;
  if(card.type==='points'){ let v=card.value||0; if(v<0 && me.shield>0){ me.shield--; toast(`🛡️ ${me.name} استخدم درع النقاط`); } else { me.score+=v; toast(v>0?`${me.name} حصل على +${v} نقطة 🎉`:`${me.name} خسر ${Math.abs(v)} نقطة 😬`); } }
  else if(card.type==='shield'){ me.shield++; toast(`🛡️ ${me.name} حصل على درع`); }
  else if(card.type==='stealShield'||card.type==='shieldSteal'){ me.stealShield++; toast('🛡️ درع سرقة'); }
  else if(card.type==='resetShield'){ me.resetShield++; toast('🔐 حماية رصيد'); }
  else if(card.type==='shieldReverse'){ me.shieldReverse++; toast('🛡️ درع قلب'); }
  else if(card.type==='shieldSkip'){ me.shieldSkip++; toast('🛡️ درع تخطي'); }
  else if(card.type==='goldenShield'){ me.goldenShield++; toast('🏆 درع ذهبي'); }
  else if(card.type==='bombShield'){ me.bombShield++; toast('🧨 درع قنبلة'); }
  else if(card.type==='reflect'){ me.reflect++; toast('🪞 عكس هجوم'); }
  else if(card.type==='cancelShuffle'){ me.cancelShuffle++; toast('🚫 إلغاء قلب'); }
  else if(card.type==='cancelReplay'){ me.cancelReplay++; toast('🛑 إلغاء إعادة'); }
  else if(card.type==='reverse'){ let nx=S.players[(picker+S.direction+S.players.length)%S.players.length]; if(nx && nx.shieldReverse>0){ nx.shieldReverse--; toast('🛡️ تم إلغاء قلب الاتجاه'); } else { S.direction=-S.direction; toast('🔄 تم قلب الاتجاه'); } }
  else if(card.type==='skip'){ let n2=S.players[(picker+S.direction+S.players.length)%S.players.length]; if(n2 && n2.shieldSkip>0){ n2.shieldSkip--; toast('🛡️ درع التخطي منع التأثير'); advanceLocal(1); return; } else { toast('⏭️ سيتم تخطي اللاعب التالي!'); advanceLocal(2); return; } }
  else if(card.type==='doubleSelf'){ me.score*=2; toast(`✖️2 تضاعف رصيد ${me.name}`); }
  else if(card.type==='reset'){ S.players.forEach(p=>{ if(p===me) return; if(p.goldenShield>0) p.goldenShield--; else if(p.resetShield>0) p.resetShield--; else p.score=0; }); toast('🧹 تم تصفير الأرصدة'); }
  else if(card.type==='stealAll'){ let g=0; S.players.forEach(p=>{ if(p===me) return; if(p.goldenShield>0) p.goldenShield--; else if(p.stealShield>0) p.stealShield--; else { g+=Math.max(0,p.score); p.score-=Math.max(0,p.score); } }); me.score+=g; toast(`🦹 أخذت ${g} نقطة`); }
  else if(card.type==='reverseBalances'){ S.players.forEach(p=>{ if(p!==me) p.score=-p.score; }); toast('🔄 تم عكس أرصدة الخصوم'); }
  else if(card.type==='bombAll'){ S.players.forEach(p=>{ if(p===me) return; if(p.goldenShield>0) p.goldenShield--; else if(p.bombShield>0) p.bombShield--; else p.score-=5; }); toast('💣 خصم 5 من كل الخصوم'); }
  else if(card.type==='randomPoints'){ let vals=[-10,-5,-2,1,3,5,7,10]; let v=vals[Math.floor(Math.random()*vals.length)]; me.score+=v; toast(`🎲 ${v>0?'+':''}${v}`); }
  else if(card.type==='randomBalances'){ let sc=S.players.map(p=>p.score); for(let i=sc.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)); [sc[i],sc[j]]=[sc[j],sc[i]];} S.players.forEach((p,i)=>p.score=sc[i]); toast('🎲 تم خلط الأرصدة'); }
  else if(card.type==='shuffle'){ let closed=[]; S.cards.forEach((cc,i)=>{ if(!cc.opened) closed.push(i); }); let vals=closed.map(i=>S.cards[i]); for(let i=vals.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)); [vals[i],vals[j]]=[vals[j],vals[i]];} closed.forEach((idx,k)=>S.cards[idx]=vals[k]); S.cards.forEach(c=>c.opened=false); toast('🔄 تم قلب كل البطاقات وخلطها'); }
  else if(card.type==='nextLevel'){ if(S.level>=3){ toast('أنت في آخر مستوى!'); return; } S.level++; S.cards=deckFor(S.level); S.players.forEach(p=>{ p.shield=0;p.bombShield=0;p.stealShield=0;p.resetShield=0;p.reflect=0;p.shieldReverse=0;p.shieldSkip=0;p.goldenShield=0;p.cancelShuffle=0;p.cancelReplay=0;p.freeze=0; }); toast(`🎉 المستوى ${S.level}!`); }
  else if(card.type==='replay'){ let opened=S.cards.filter((cc,i)=>cc.opened && i!==S.lastPicked); if(opened.length){ let again=opened[Math.floor(Math.random()*opened.length)]; applyLocalEffect(again,picker,null,null); return; } }
  else if(card.type==='doubleChoice'){ S.doubleChoicePick=[]; S.targetMode='doubleChoice'; toast('🃏 اكشف بطاقتين مغلقتين'); return; }
  else if(t && card.type==='steal'){ if(t.goldenShield>0){ t.goldenShield--; toast('🏆 الدرع الذهبي منع السرقة'); } else if(t.stealShield>0){ t.stealShield--; toast('🛡️ الدرع منع السرقة'); } else if(t.reflect>0){ t.reflect--; let take=Math.min(amt,Math.max(0,me.score)); me.score-=take; t.score+=take; toast('🪞 انعكست السرقة'); } else { let take=Math.min(amt,Math.max(0,t.score)); t.score-=take; me.score+=take; toast(`💰 سرقت ${take} من ${t.name}`); } }
  else if(t && card.type==='bomb'){ if(t.goldenShield>0){ t.goldenShield--; toast('🏆 منع القنبلة'); } else if(t.bombShield>0){ t.bombShield--; toast('🧨 درع القنبلة حمى'); } else { t.score-=amt; toast(`💣 خسر ${t.name} ${amt}`); } }
  else if(t && card.type==='doubleTarget'){ if(t.goldenShield>0){ t.goldenShield--; toast('🏆 منع المضاعفة'); } else { t.score*=2; toast(`🎯 تضاعف رصيد ${t.name}`); } }
  else if(t && card.type==='resetPlayer'){ if(t.goldenShield>0){ t.goldenShield--; toast('🏆 منع التصفير'); } else if(t.resetShield>0){ t.resetShield--; toast('🔐 درع التصفير حمى'); } else { t.score=0; toast(`💥 تم تصفير ${t.name}`); } }
  else if(t && card.type==='exchange'){ if(t.goldenShield>0){ t.goldenShield--; toast('🏆 منع التبادل'); } else { let tmp=me.score; me.score=t.score; t.score=tmp; toast('🔃 تم تبادل الرصيدين'); } }
  else if(card.type==='exchangePlayers'){
    if(first!=null && t){ let a=S.players[first]; if(a && a!==t){ let tmp=a.score; a.score=t.score; t.score=tmp; toast(`تم تبادل ${a.name} و ${t.name}`); } }
    else if(t){ let tmp=me.score; me.score=t.score; t.score=tmp; toast('🔃 تم التبادل'); }
  }
  else if(t && card.type==='freeze'){ t.freeze=2; toast(`🧊 تم تجميد ${t.name}`); }
  advanceLocal(1);
}

function pickCardLocal(idx){
  if(S.targetMode==='doubleChoice'){
    if(S.cards[idx].opened) return;
    S.cards[idx].opened=true;
    S.doubleChoicePick.push(idx);
    if(S.doubleChoicePick.length<2){ toast('🃏 اختر بطاقة ثانية'); render(); return; }
    // player picks one of the two to activate — handled by clicking again on one of them
    toast('🃏 اضغط على إحدى البطاقتين لتفعيلها'); render(); return;
  }
  if(S.targetMode==='doubleChoiceActivate'){
    if(!S.doubleChoicePick.includes(idx)) return;
    let card=S.cards[idx]; S.targetMode=null; S.doubleChoicePick=[];
    S.bigCard=card; applyLocalEffect(card,S.current,null,null); checkEndLocal(); render(); return;
  }
  if(S.replayMode){ if(!S.cards[idx].opened) return; S.replayMode=false; let card=S.cards[idx]; S.bigCard=card; applyLocalEffect(card,S.current,null,null); checkEndLocal(); render(); return; }
  if(S.targetMode){ return; }
  let card=S.cards[idx]; if(card.opened) return;
  if(S.bot && S.current!==0){ toast('دور الحاسوب…'); return; }
  if(!S.bot && S.current!==0 && S.mode==='offline'){ /* local hot-seat: anyone can play on their turn */ }
  card.opened=true; S.lastPicked=idx; S.bigCard=card;
  let need=['steal','bomb','doubleTarget','resetPlayer','exchange','exchangePlayers','freeze'];
  if(need.includes(card.type)){ S.targetMode=card.type; S.targetCardIndex=idx; S.targetFirst=null; toast('🎯 اختر لاعبًا'); render(); return; }
  if(card.type==='doubleChoice'){ S.targetMode='doubleChoice'; S.doubleChoicePick=[]; toast('🃏 اكشف بطاقتين'); render(); return; }
  if(card.type==='replay'){ S.replayMode=true; toast('♻️ اختر بطاقة مكشوفة'); render(); return; }
  applyLocalEffect(card,S.current,null,null);
  checkEndLocal(); render();
  if(S.bot && S.screen==='game') setTimeout(botTurn,900);
}
function chooseTargetLocal(targetIdx){
  if(!S.targetMode) return;
  if(S.targetMode==='exchangePlayers' && S.targetFirst==null){ S.targetFirst=targetIdx; toast('اختر اللاعب الثاني'); render(); return; }
  let mode=S.targetMode; let idx=S.targetCardIndex; let card=S.cards[idx]; let first=S.targetFirst;
  S.targetMode=null; S.targetCardIndex=null; S.targetFirst=null;
  applyLocalEffect(card,S.current,targetIdx,first);
  checkEndLocal(); render();
  if(S.bot && S.screen==='game') setTimeout(botTurn,900);
}
function botTurn(){
  if(!S.bot || S.screen!=='game' || S.current===0) return;
  let closed=S.cards.map((c,i)=>c.opened?-1:i).filter(i=>i>=0);
  if(!closed.length) return;
  let idx=closed[Math.floor(Math.random()*closed.length)];
  pickCardLocal(idx);
  // bot target: if it needs target, pick random other player
  if(S.targetMode && S.targetMode!=='doubleChoice'){
    let others=S.players.map((_,i)=>i).filter(i=>i!==S.current);
    let t=others[Math.floor(Math.random()*others.length)];
    if(S.targetMode==='exchangePlayers'){ chooseTargetLocal(t); if(S.targetMode==='exchangePlayers'){ let t2=others.filter(i=>i!==t)[Math.floor(Math.random()*Math.max(1,others.length-1))]; chooseTargetLocal(t2); } }
    else chooseTargetLocal(t);
  }
  if(S.targetMode==='doubleChoice'){
    let c2=S.cards.map((c,i)=>c.opened?-1:i).filter(i=>i>=0);
    if(c2.length){ pickCardLocal(c2[0]); }
    if(S.doubleChoicePick.length>=2){ S.targetMode='doubleChoiceActivate'; pickCardLocal(S.doubleChoicePick[0]); }
  }
}

/* ================= ONLINE ================= */
function handleServer(o){
  if(!o||typeof o!=='object') return; let t=String(o.type||'');
  if(t==='waiting'){ if(Array.isArray(o.players)) S.waitingPlayers=o.players; if(o.current!=null) S.waitingCount=Number(o.current); if(o.total!=null) S.waitingTotal=Number(o.total); S.modal='searching'; render(); return; }
  if(t==='room_created'){ if(o.roomCode){ S.roomCode=String(o.roomCode); } S.modal='waitingRoom'; render(); return; }
  if(t==='room_players'){ if(Array.isArray(o.players)) S.waitingPlayers=o.players; if(o.current!=null) S.waitingCount=Number(o.current); if(o.total!=null) S.waitingTotal=Number(o.total); if(o.roomCode) S.roomCode=String(o.roomCode); if(S.modal==='join'||S.modal==='create'||S.modal==='searching') S.modal='waitingRoom'; render(); return; }
  if(t==='matched'||t==='game_start'||t==='game_started'||t==='start_game'){
    // myIndex: server sends myPlayer / myPlayerId = 1-based
    let my = o.myPlayerId!=null?Number(o.myPlayerId)-1 : o.myPlayer!=null?Number(o.myPlayer)-1 : o.myIndex!=null?Number(o.myIndex):0;
    S.myIndex=Math.max(0,my); S.online=true; S.bot=false; S.mode='online';
    S.players = (o.players||[]).map(p=>({name:p.name||'لاعب',score:Number(p.score)||0,shield:Number(p.shield)||0,bombShield:Number(p.bombShield)||0,stealShield:Number(p.stealShield)||0,resetShield:Number(p.resetShield)||0,reflect:Number(p.reflect)||0,shieldReverse:Number(p.shieldReverse)||0,shieldSkip:Number(p.shieldSkip)||0,goldenShield:Number(p.goldenShield)||0,cancelShuffle:Number(p.cancelShuffle)||0,cancelReplay:Number(p.cancelReplay)||0,freeze:Number(p.freeze)||0,avatar:AVATARS[(p.id||1)-1%AVATARS.length]||'🦸'}));
    // Server players are in server order. For display we ROTATE so "me" is at position 0 — but we keep server indices for targets.
    // Simpler & correct: keep server order, myIndex is absolute. Display uses server order, current is absolute.
    S.level=Number(o.level)||1; S.direction=Number(o.direction)||1;
    S.current = o.currentPlayer!=null ? (o.currentPlayerBase===1?Number(o.currentPlayer)-1:Number(o.currentPlayer)) : 0;
    S.cards = normalizeCards(o.cards||[]);
    if(o.roomCode) S.roomCode=String(o.roomCode);
    S.modal=null; S.confirm=null; S.targetMode=null; S.bigCard=null; S.screen='game'; S.seconds=Number(o.seconds)||15;
    startOnlineTimer(); toast('🌐 بدأت الجولة أونلاين — الجميع يلعب بنفس البطاقات والنقاط'); render(); return;
  }
  if(t==='game_state'||t==='state'||t==='sync'){ applyGameState(o); return; }
  if(t==='card_picked'||t==='card_pick'||t==='pick_card'){
    // FIX: reveal for EVERYONE — no by===myId check
    let idx=Number(o.cardIndex!=null?o.cardIndex:o.index);
    if(Number.isFinite(idx) && S.cards[idx]){
      let srvCard = o.card ? normalizeCards([o.card])[0] : null;
      if(srvCard) S.cards[idx]={...srvCard, opened:true};
      else S.cards[idx]={...S.cards[idx], opened:true};
      S.bigCard=S.cards[idx];
    }
    if(o.currentPlayer!=null) S.current = o.currentPlayerBase===1?Number(o.currentPlayer)-1:Number(o.currentPlayer);
    render(); return;
  }
  if(t==='timer'||t==='time_update'||t==='tick'){ if(o.seconds!=null) S.seconds=Number(o.seconds); render(); return; }
  if(t==='turn_skipped'||t==='turn_timeout'){ toast('⏱️ تم تخطي الدور'); if(o.currentPlayer!=null) S.current=o.currentPlayerBase===1?Number(o.currentPlayer)-1:Number(o.currentPlayer); S.seconds=15; render(); return; }
  if(t==='level_changed'){ S.level=Number(o.level)||S.level; if(Array.isArray(o.cards)&&o.cards.length) S.cards=normalizeCards(o.cards); S.targetMode=null; S.bigCard=null; toast('🎉 انتقل الجميع للمستوى '+S.level); render(); return; }
  if(t==='cards_shuffled'){ if(Array.isArray(o.cards)&&o.cards.length) S.cards=normalizeCards(o.cards); toast('🔄 تم خلط البطاقات للجميع'); render(); return; }
  if(t==='game_over'||t==='gameOver'){
    if(Array.isArray(o.players)&&o.players.length){ S.players=o.players.map(p=>({name:p.name||'لاعب',score:Number(p.score)||0,shield:Number(p.shield)||0,bombShield:Number(p.bombShield)||0,stealShield:Number(p.stealShield)||0,resetShield:Number(p.resetShield)||0,reflect:Number(p.reflect)||0,shieldReverse:Number(p.shieldReverse)||0,shieldSkip:Number(p.shieldSkip)||0,goldenShield:Number(p.goldenShield)||0,cancelShuffle:Number(p.cancelShuffle)||0,cancelReplay:Number(p.cancelReplay)||0,freeze:Number(p.freeze)||0,avatar:'🦸'})); }
    let best=Math.max(...S.players.map(p=>p.score)); let win=S.players.filter(p=>p.score===best);
    S.winnerText = o.winner ? `🏆 الفائز هو ${o.winner}` : (win.length===1?`🏆 الفائز هو ${win[0].name} برصيد ${best} نقطة`:`🏆 تعادل برصيد ${best} نقطة`);
    clearInterval(S.timerId); S.screen='result'; render(); return;
  }
  if(t==='opponent_disconnected'||t==='player_disconnected'){ toast('⚠️ غادر أحد اللاعبين'); render(); return; }
  if(t==='player_rejoined'){ toast('✅ عاد '+ (o.player||'لاعب')); render(); return; }
  if(t==='chat'){ S.chat.push({name:String(o.name||'لاعب'),message:String(o.message||''),mine:String(o.name||'')===S.name}); render(); return; }
  if(t==='need_target'){ let idx=Number(o.cardIndex); let type=String(o.cardType||''); S.targetMode=type; S.targetCardIndex=idx; S.targetFirst=null; toast('🎯 اختر لاعبًا'); render(); return; }
  if(t==='room_error'||t==='error'){ let msg=String(o.message||o.error||'خطأ'); S.error=msg; toast(msg); if(S.modal==='waitingRoom') S.modal='join'; render(); return; }
  if(t==='search_cancelled'){ S.modal='menu'; render(); return; }
  if(t==='left_game'){ S.online=false; S.screen='home'; S.modal=null; render(); return; }
}
function normalizeCards(arr){
  let out = arr.map((c,i)=>{
    if(typeof c==='string') return {type:c,opened:false};
    let t=String(c.type||c.cardType||'points');
    return {type:t, value:c.value!=null?Number(c.value):undefined, amount:c.amount!=null?Number(c.amount):undefined, opened:!!(c.opened||c.isOpened)};
  });
  while(out.length<45) out.push({type:'points',value:1,opened:false});
  return out.slice(0,45);
}
function applyGameState(o){
  // FIX: scores come ONLY from server. Never calculate locally.
  if(Array.isArray(o.players)&&o.players.length){
    S.players=o.players.map(p=>({name:p.name||'لاعب',score:Number(p.score)||0,shield:Number(p.shield)||0,bombShield:Number(p.bombShield)||0,stealShield:Number(p.stealShield)||0,resetShield:Number(p.resetShield)||0,reflect:Number(p.reflect)||0,shieldReverse:Number(p.shieldReverse)||0,shieldSkip:Number(p.shieldSkip)||0,goldenShield:Number(p.goldenShield)||0,cancelShuffle:Number(p.cancelShuffle)||0,cancelReplay:Number(p.cancelReplay)||0,freeze:Number(p.freeze)||0,avatar:AVATARS[(Number(p.id)||1)-1%AVATARS.length]||'🦸'}));
  }
  if(o.level!=null) S.level=Number(o.level)||1;
  if(o.direction!=null) S.direction=Number(o.direction)||1;
  if(o.currentPlayer!=null) S.current = o.currentPlayerBase===1 ? Number(o.currentPlayer)-1 : Number(o.currentPlayer);
  if(Array.isArray(o.cards)&&o.cards.length) S.cards=normalizeCards(o.cards);
  if(o.seconds!=null) S.seconds=Number(o.seconds);
  render();
}
function startOnlineTimer(){ clearInterval(S.timerId); S.timerId=setInterval(()=>{ if(S.screen!=='game'||!S.online) return; /* server drives timer via timer messages; local countdown is display only */ },1000); }

function pickCardOnline(idx){
  let card=S.cards[idx]; if(!card||card.opened) return;
  if(S.current!==S.myIndex){ toast(`انتظر دورك - دور ${S.players[S.current]?.name||'اللاعب الحالي'}`); return; }
  let need=['steal','bomb','doubleTarget','resetPlayer','exchange','exchangePlayers','freeze'];
  if(need.includes(card.type)){ S.targetMode=card.type; S.targetCardIndex=idx; S.targetFirst=null; toast('🎯 اختر لاعبًا'); render(); return; }
  // Optimistic reveal is OK, but server card_picked is authoritative and will re-sync
  // Do NOT calculate score locally.
  wsSend({type:'pick_card', cardIndex:idx, name:S.name});
  toast('بانتظار السيرفر…'); render();
}
function chooseTargetOnline(targetServerIdx){
  if(!S.targetMode) return;
  if(S.targetMode==='exchangePlayers' && S.targetFirst==null){ S.targetFirst=targetServerIdx; toast('اختر اللاعب الثاني'); render(); return; }
  let idx=S.targetCardIndex; let mode=S.targetMode; let first=S.targetFirst;
  S.targetMode=null; S.targetCardIndex=null; S.targetFirst=null;
  let msg={type:'pick_card', cardIndex:idx, name:S.name, target:targetServerIdx+1, targetBase:1};
  if(first!=null) msg.first=first+1, msg.firstBase=1;
  wsSend(msg); toast('بانتظار السيرفر…'); render();
}

      ${S.online&&S.chatOpen?`<div style="background:rgba(0,0,0,.25);border-radius:12px;padding:8px;text-align:right;max-height:130px;overflow-y:auto">
        ${S.chat.length===0?'<div style="font-size:13px;color:#cfd8dc">لا رسائل بعد</div>':S.chat.map(m=>`<div style="font-size:13px;padding:2px 0"><b>${m.mine?'أنت':m.name}:</b> ${m.message}</div>`).join('')}
        <div style="display:flex;gap:6px;margin-top:6px"><input value="${S.chatText.replace(/"/g,'&quot;')}" oninput="S.chatText=this.value" placeholder="اكتب رسالة…" style="flex:1;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff"><button class="btn" style="padding:8px 12px;font-size:13px;margin:0" onclick="sendChat()">إرسال</button></div></div>`:''}
      ${S.toast?`<div style="min-height:38px;margin:4px 0;font-size:14px;font-weight:700;background:rgba(255,255,255,.08);border-radius:12px;padding:6px 10px;display:flex;align-items:center;justify-content:center">${S.toast}</div>`:''}
      ${S.targetMode?`<div style="font-size:13px;font-weight:800;color:#ff9800;margin-bottom:4px">🎯 اختر لاعبًا — اضغط على بطاقة اللاعب المستهدف</div>`:''}
      ${S.targetMode==='doubleChoice'?`<div style="font-size:13px;font-weight:800;color:#ffc107;margin-bottom:4px">🃏 اكشف بطاقتين مغلقتين ثم اضغط على واحدة لتفعيلها</div>`:''}
      ${S.replayMode?`<div style="font-size:13px;font-weight:800;color:#00e676;margin-bottom:4px">♻️ اختر بطاقة مكشوفة لإعادة تفعيلها</div>`:''}
      <div dir="ltr" style="flex:1 1 auto;display:grid;grid-template-areas:'top top top' 'left cards right' 'bottom bottom bottom';grid-template-columns:${S.players.length>=3?'58px':'0px'} minmax(0,1fr) ${S.players.length>=4?'58px':'0px'};grid-template-rows:auto minmax(0,1fr) auto;gap:6px;margin:4px 0;min-height:0">
        <div style="grid-area:top;display:flex;justify-content:center;min-width:0">${playerCard(1,'top')}</div>
        <div style="grid-area:left;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0">${S.players.length>=3?playerCard(2,'side'):''}</div>
        <div style="grid-area:cards;min-width:0;display:flex"><div class="cards-grid">${cardsHtml()}</div></div>
        <div style="grid-area:right;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0">${S.players.length>=4?playerCard(3,'side'):''}</div>
        <div style="grid-area:bottom;display:flex;justify-content:center;min-width:0">${playerCard(0,'bottom')}</div>
      </div>
      <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap">
        ${!S.online?`<button class="btn secondary" style="padding:8px 12px;font-size:13px" onclick="restartLocal()">🔄 إعادة الجولة</button>`:''}
        <button class="btn" style="padding:8px 12px;font-size:13px" onclick="goHomeConfirm()">${S.online?'🚪 مغادرة':'🏠 الرئيسية'}</button>
      </div>
    </div></div>${modalHtml()}${bigCardHtml()}${toastHtml()}`;
    return;
  }
  if(S.screen==='result'){
    root.innerHTML=`<div style="max-width:720px;margin:auto;padding:14px;text-align:center"><h1 style="font-size:32px">🏆 انتهت الجولة</h1>
    <div style="background:rgba(255,255,255,.1);border-radius:20px;padding:22px 16px;margin:16px 0"><div style="font-size:22px;font-weight:900">${S.winnerText||''}</div>
    <div style="font-size:14px;color:#cfd8dc;margin-top:10px;line-height:1.7">${S.players.map(p=>`<div>${p.name}: ${p.score} نقطة ${p.score===Math.max(...S.players.map(x=>x.score))?'⭐':''}</div>`).join('')}</div></div>
    <button class="btn gold" onclick="playAgain()">🔄 العب مرة أخرى</button>
    <button class="btn secondary" onclick="goHome()">🏠 الرئيسية</button></div>${modalHtml()}${toastHtml()}`;
    return;
  }
}
function toastHtml(){ return S.toast?`<div class="toast show">${S.toast}</div>`:''; }
function bigCardHtml(){
  if(!S.bigCard) return '';
  let c=S.bigCard; let inf=infoFor(c);
  return `<div class="bigCardOverlay" onclick="S.bigCard=null;render()"><div style="width:260px;height:360px;border-radius:24px;background:${c.type==='points'?(c.value||0)>0?'linear-gradient(160deg,#e8f5e9,#a5d6a7)':'linear-gradient(160deg,#ffebee,#ef9a9a)':'linear-gradient(160deg,#fff3e0,#ffcc80)'};color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 4px #fff;animation:bigIn .55s;padding:18px;text-align:center;position:relative">
    <div style="font-size:92px;line-height:1">${inf.icon}</div>
    <div style="font-size:26px;font-weight:900">${c.type==='points'?(c.value||0)>0?'نقاط ذهبية! 🎉':'يا خسارة! 😬':inf.label}</div>
    <div style="font-size:15px;color:#444;font-weight:600">${c.type==='points'?(c.value||0)>0?`حصلت على +${c.value} نقطة`:`خسرت ${Math.abs(c.value||0)} نقطة`:inf.label}</div>
    <div style="position:absolute;bottom:14px;font-size:12px;color:#777;font-weight:700">اضغط في أي مكان للمتابعة 👆</div></div></div>`;
}
function modalHtml(){
  if(S.confirm) return `<div class="modal"><div class="modalBox"><h3>${S.confirm.title}</h3><p>${S.confirm.msg}</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="confirmYes()">✅ نعم</button><button class="btn secondary" onclick="S.confirm=null;render()">❌ لا</button></div></div></div>`;
  if(!S.modal) return '';
  if(S.modal==='menu') return `<div class="modal" onclick="S.modal=null;render()"><div class="modalBox" onclick="event.stopPropagation()"><h3>🌐 العب أونلاين</h3><p>${S.wsStatus==='connecting'?'جاري الاتصال بالسيرفر…':S.wsStatus==='connected'?'✅ متصل بالسيرفر — اختر طريقة اللعب':S.wsStatus==='error'||S.wsStatus==='closed'?'⚠️ تعذر الاتصال بالسيرفر - تحقق من Render':'اختر طريقة اللعب مع الآخرين'}</p>
    ${(S.wsStatus==='error'||S.wsStatus==='closed')?`<button class="btn" onclick="wsConnect()">🔄 إعادة المحاولة</button>`:''}
    <label style="display:block;text-align:right;font-size:13px;color:#b0c4de;margin-bottom:8px">اسمك في اللعبة<input value="${S.name}" oninput="S.name=this.value.slice(0,20)" placeholder="اللاعب 1" style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:15px;margin-top:5px"></label>
    <div style="display:flex;flex-direction:column;gap:8px"><button class="btn" ${S.wsStatus!=='connected'?'disabled':''} onclick="S.modal='onlinePlay';render()">🎮 لعب أونلاين</button><button class="btn" ${S.wsStatus!=='connected'?'disabled':''} onclick="S.modal='friend';render()">👥 لعب مع صديق</button><button class="btn secondary" onclick="S.modal=null;render()">⬅️ رجوع</button></div></div></div>`;
  if(S.modal==='onlinePlay') return `<div class="modal"><div class="modalBox"><h3>اختر عدد اللاعبين</h3><p>سيتم البحث عن منافسين حقيقيين بنفس العدد.</p><div style="display:flex;gap:8px;justify-content:center">${[2,3,4].map(n=>`<button class="btn ${S.playerCount===n?'':'secondary'}" style="flex:1" onclick="setCount(${n})">${n}</button>`).join('')}</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><button class="btn" onclick="startSearch()">🔍 ابدأ البحث</button><button class="btn secondary" onclick="S.modal='menu';render()">⬅️ رجوع</button></div></div></div>`;
  if(S.modal==='friend') return `<div class="modal"><div class="modalBox"><h3>👥 لعب مع صديق</h3><p>أنشئ غرفة حقيقية أو ادخل إلى غرفة صديقك.</p><div style="display:flex;flex-direction:column;gap:8px"><button class="btn" onclick="S.modal='create';render()">➕ إنشاء غرفة</button><button class="btn" onclick="S.modal='join';render()">🔑 دخول لغرفة</button><button class="btn secondary" onclick="S.modal='menu';render()">⬅️ رجوع</button></div></div></div>`;
  if(S.modal==='create') return `<div class="modal"><div class="modalBox"><h3>➕ إنشاء غرفة</h3><p>اختر عدد اللاعبين ثم أنشئ غرفة — الرقم يأتي من السيرفر.</p><div style="display:flex;gap:8px;justify-content:center">${[2,3,4].map(n=>`<button class="btn ${S.playerCount===n?'':'secondary'}" style="flex:1" onclick="setCount(${n})">${n}</button>`).join('')}</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><button class="btn" onclick="createRoom()">إنشاء الغرفة</button><button class="btn secondary" onclick="S.modal='friend';render()">⬅️ رجوع</button></div></div></div>`;
  if(S.modal==='join') return `<div class="modal"><div class="modalBox"><h3>🔑 دخول لغرفة</h3><p>أدخل رقم الغرفة المكوّن من 6 أرقام</p><input value="${S.roomInput}" oninput="S.roomInput=this.value.replace(/[^0-9]/g,'').slice(0,6)" inputmode="numeric" placeholder="000000" style="width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:22px;text-align:center;letter-spacing:4px;font-weight:800">${S.error?`<p style="color:#ff8a80">${S.error}</p>`:''}<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><button class="btn" onclick="joinRoom()">دخول</button><button class="btn secondary" onclick="S.modal='friend';render()">⬅️ رجوع</button></div></div></div>`;
  if(S.modal==='searching') return `<div class="modal"><div class="modalBox"><h3>🔍 جاري البحث…</h3><p>بانتظار لاعبين حقيقيين — ${S.waitingCount} / ${S.waitingTotal}</p><div style="font-size:13px;line-height:1.8">${S.waitingPlayers.map(n=>`<div>👤 ${n}</div>`).join('')}</div><button class="btn danger" onclick="cancelSearch()">إلغاء البحث</button></div></div>`;
  if(S.modal==='waitingRoom') return `<div class="modal"><div class="modalBox"><h3>غرفتك جاهزة</h3><p>أرسل الرقم لصديقك — ستبدأ الجولة تلقائياً عند اكتمال العدد.</p><div style="font-size:32px;font-weight:900;letter-spacing:4px;border:2px dashed #ffc107;border-radius:14px;padding:14px 8px;margin:8px 0">${S.roomCode||S.roomInput||'بانتظار السيرفر…'}</div><div style="font-size:16px;font-weight:700">👥 اللاعبون: ${S.waitingCount} / ${S.waitingTotal}</div><div style="font-size:13px;line-height:1.8;margin-top:8px">${S.waitingPlayers.map(n=>`<div>👤 ${n}</div>`).join('')}</div>${S.error?`<p style="color:#ff8a80">${S.error}</p>`:''}<button class="btn danger" onclick="cancelRoom()">إلغاء</button></div></div>`;
  return '';
}
function setCount(n){ S.playerCount=n; render(); }
function toggleSound(){ S.sound=!S.sound; toast(S.sound?'🔊 تم تشغيل الصوت':'🔇 تم كتم الصوت'); render(); }
function toggleChat(){ S.chatOpen=!S.chatOpen; render(); }
function sendChat(){ let m=S.chatText.trim(); if(!m) return; wsSend({type:'chat',message:m,name:S.name}); S.chat.push({name:S.name,message:m,mine:true}); S.chatText=''; render(); }
function openOnlineMenu(){ S.modal='menu'; S.error=''; wsConnect(); render(); }
function startSearch(){ S.name=S.name.trim()||'اللاعب 1'; S.error=''; S.waitingPlayers=[S.name]; S.waitingCount=1; S.waitingTotal=S.playerCount; S.modal='searching'; wsSend({type:'find_match',name:S.name,playerCount:S.playerCount}); render(); }
function createRoom(){ S.name=S.name.trim()||'اللاعب 1'; S.error=''; S.waitingPlayers=[S.name]; S.waitingCount=1; S.waitingTotal=S.playerCount; S.modal='waitingRoom'; wsSend({type:'create_room',name:S.name,playerCount:S.playerCount}); render(); }
function joinRoom(){ if(S.roomInput.length!==6){ toast('أدخل رقم الغرفة المكوّن من 6 أرقام'); return; } S.name=S.name.trim()||'اللاعب 1'; S.error=''; S.waitingPlayers=[S.name]; S.waitingCount=1; S.waitingTotal=S.playerCount; S.modal='waitingRoom'; wsSend({type:'join_room',name:S.name,roomCode:S.roomInput}); render(); }
function cancelSearch(){ wsSend({type:'cancel_search'}); S.modal='menu'; render(); }
function cancelRoom(){ wsSend({type:'leave_game'}); S.modal='friend'; render(); }
function confirmYes(){ let c=S.confirm; S.confirm=null; if(c && c.onYes) c.onYes(); render(); }
function goHomeConfirm(){
  if(S.online){ S.confirm={title:'🚪 مغادرة الجولة',msg:'هل تريد مغادرة الجولة أونلاين؟',onYes:()=>{ try{wsSend({type:'leave_game'});}catch(e){} S.online=false; clearInterval(S.timerId); S.screen='home'; S.modal=null; render(); }}; render(); return; }
  S.confirm={title:'🏠 الرئيسية',msg:'هل تريد العودة إلى الصفحة الرئيسية؟',onYes:()=>{ clearInterval(S.timerId); S.screen='home'; S.modal=null; render(); }}; render();
}
function goHome(){ clearInterval(S.timerId); S.online=false; S.screen='home'; S.modal=null; render(); }
function restartLocal(){ startLocal(S.players.length, S.bot); }
function playAgain(){ if(S.online){ goHome(); openOnlineMenu(); return; } startLocal(S.players.length, S.bot); }
S.sound=true;
render();
</script>
  </body>
</html>
