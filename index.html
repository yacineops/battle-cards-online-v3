:root{
  --bg1:#0f2027;
  --bg2:#203a43;
  --bg3:#2c5364;
  --card:#1e3a52;
  --accent:#ffc107;
  --green:#00e676;
  --orange:#ff9800;
  --blue:#2196f3;
  --surface:#122b3a;
  --surface-2:#1e3a52;
  --text:#ffffff;
  --muted:#b0c4de;
  --line:rgba(255,255,255,.14);
  --gold:#ffdf6e;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#0f2027;
    --surface-2:#1e3a52;
    --text:#ffffff;
    --muted:#b0c4de;
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  padding:0
}

body{
  background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg3));
  background-attachment:fixed;
  color:var(--text);
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  overflow-x:clip
}

button{
  font-family:inherit
}

.screen{
  max-width:720px;
  margin:auto;
  padding:14px;
  animation:fadeIn .4s ease;
  position:relative;
  z-index:1
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(-3deg)
  }

  50%{
    transform:translateY(-8px) rotate(3deg)
  }
}

@keyframes pop{
  0%{
    transform:scale(.92)
  }

  50%{
    transform:scale(1.05)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes pulse{
  0%,100%{
    box-shadow:0 0 4px rgba(255,152,0,.3)
  }

  50%{
    box-shadow:0 0 16px rgba(255,152,0,.9)
  }
}

@keyframes bump{
  0%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.35);
    color:#00e676
  }

  100%{
    transform:scale(1)
  }
}

@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }

  25%{
    transform:translateX(-5px)
  }

  75%{
    transform:translateX(5px)
  }
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:.8
  }
}

@keyframes bigCardIn{
  0%{
    transform:scale(.2) rotate(-18deg);
    opacity:0
  }

  60%{
    transform:scale(1.12) rotate(3deg);
    opacity:1
  }

  100%{
    transform:scale(1) rotate(0)
  }
}

@keyframes iconBounce{
  0%{
    transform:scale(0) rotate(-20deg)
  }

  60%{
    transform:scale(1.3) rotate(8deg)
  }

  100%{
    transform:scale(1) rotate(0)
  }
}

@keyframes shine{
  from{
    transform:translateX(-100%)
  }

  to{
    transform:translateX(100%)
  }
}

@keyframes particleFly{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1
  }

  100%{
    transform:translate(var(--dx),var(--dy)) scale(.2);
    opacity:0
  }
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(0)
  }

  25%{
    transform:rotate(-3deg) scale(1.05)
  }

  75%{
    transform:rotate(3deg) scale(1.05)
  }
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 18px;
  margin:5px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg,#1976d2,#2196f3);
  color:white;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  transition:.2s
}

.btn:active{
  transform:scale(.94)
}

.btn:hover{
  filter:brightness(1.15);
  transform:translateY(-1px)
}

.btn.secondary{
  background:linear-gradient(135deg,#455a64,#607d8b)
}

.btn.gold{
  background:linear-gradient(135deg,#ff8f00,#ffc107);
  color:#222
}

.btn.danger{
  background:linear-gradient(135deg,#c62828,#ef5350)
}

.btn.online-blue{
  background:linear-gradient(135deg,#1565c0,#2196f3);
  width:100%;
  margin:12px 0 0;
  font-size:18px;
  padding:16px
}

.iconBtn{
  width:44px;
  height:44px;
  padding:0;
  font-size:20px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(6px);
  border:0;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center
}

.iconBtn.off{
  opacity:.45;
  filter:grayscale(1)
}

.player{
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.15);
  border-radius:16px;
  padding:10px 4px;
  transition:.3s;
  backdrop-filter:blur(6px);
  position:relative;
  overflow:hidden;
  text-align:center
}

.player.current{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(0,230,118,.4),0 0 18px rgba(0,230,118,.35);
  transform:translateY(-2px);
  background:rgba(0,230,118,.08)
}

.player.current::after{
  content:'⭐ دورك';
  position:absolute;
  top:4px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  background:var(--green);
  color:#000;
  padding:2px 7px;
  border-radius:99px;
  font-weight:800
}

.player.frozen{
  filter:grayscale(.6);
  opacity:.75
}

.player.targetSelectable{
  border-color:var(--orange);
  cursor:pointer;
  animation:pulse 1s infinite
}

.player.targetSelectable:hover{
  transform:scale(1.06)
}

.card{
  height:68px;
  border-radius:14px;
  cursor:pointer;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,1.6,.4,1),box-shadow .2s
}

.card:hover{
  transform:translateY(-3px) scale(1.03)
}

.card .face{
  position:absolute;
  inset:0;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  backface-visibility:hidden;
  overflow:hidden
}

.card .back{
  background:linear-gradient(135deg,#263f59,#3a5a7c);
  border:2px solid #5a7d9c;
  font-size:28px;
  box-shadow:0 4px 10px rgba(0,0,0,.3)
}

.card .back::after{
  content:'';
  position:absolute;
  inset:6px;
  border:1px dashed rgba(255,255,255,.25);
  border-radius:10px
}

.card .front{
  background:linear-gradient(135deg,#fff,#ffe082);
  color:#111;
  border:2px solid #fff;
  transform:rotateY(180deg);
  box-shadow:0 4px 12px rgba(0,0,0,.3)
}

.card.open{
  transform:rotateY(180deg);
  cursor:default
}

.card.open.pos .front{
  background:linear-gradient(135deg,#c8e6c9,#a5d6a7)
}

.card.open.neg .front{
  background:linear-gradient(135deg,#ffcdd2,#ef9a9a)
}

.card.open.special .front{
  background:linear-gradient(135deg,#fff3e0,#ffcc80)
}

.card.doubleChoice,.card.replaySelectable{
  animation:pulse 1s infinite;
  border-color:var(--orange);
  cursor:pointer
}

.bigCardOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(6px);
  z-index:1500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  animation:fadeIn .25s
}

.bigCard{
  width:260px;
  height:360px;
  border-radius:24px;
  background:linear-gradient(160deg,#fff,#ffe082);
  color:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 4px #fff,0 0 50px rgba(255,215,0,.6);
  animation:bigCardIn .55s cubic-bezier(.2,1.5,.3,1);
  position:relative;
  overflow:hidden;
  text-align:center;
  padding:18px
}

.bigCard.pos{
  background:linear-gradient(160deg,#e8f5e9,#a5d6a7)
}

.bigCard.neg{
  background:linear-gradient(160deg,#ffebee,#ef9a9a)
}

.bigCard.special{
  background:linear-gradient(160deg,#fff3e0,#ffcc80)
}

.bigCard.goldCard{
  background:linear-gradient(160deg,#fffde7,#ffd54f);
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 4px #ffc107,0 0 70px rgba(255,193,7,.9)
}

.bigCard .bigIcon{
  font-size:92px;
  line-height:1;
  animation:iconBounce .7s ease;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.25))
}

.bigCard .bigTitle{
  font-size:26px;
  font-weight:900;
  line-height:1.2
}

.bigCard .bigDesc{
  font-size:15px;
  color:#444;
  line-height:1.5;
  font-weight:600
}

.bigCard .bigPoints{
  font-size:52px;
  font-weight:900;
  line-height:1
}

.bigCard .shine{
  position:absolute;
  inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 48%,transparent 62%);
  animation:shine 1.1s ease
}

.bigCard .tapHint{
  position:absolute;
  bottom:14px;
  font-size:12px;
  color:#777;
  font-weight:700
}

.particle{
  position:fixed;
  pointer-events:none;
  z-index:1600;
  font-size:26px;
  animation:particleFly 1s ease-out forwards
}

.confetti{
  position:fixed;
  top:-10px;
  pointer-events:none;
  z-index:999;
  font-size:22px;
  animation:fall linear forwards
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:99px;
  font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:.3s;
  z-index:1000;
  max-width:90%;
  font-size:14px;
  text-align:center
}

.toast.show{
  transform:translateX(-50%) translateY(0)
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1001;
  padding:16px;
  backdrop-filter:blur(4px)
}

.modalBox{
  background:#1e2a38;
  border-radius:20px;
  padding:22px;
  width:100%;
  max-width:360px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation:pop .3s ease;
  color:#fff
}

.modalBox h3{
  margin:0 0 8px;
  font-size:20px
}

.modalBox p{
  color:#b0c4de;
  font-size:14px;
  line-height:1.6;
  margin:0 0 16px
}

#gameScreen{
  height:100dvh;
  max-height:100dvh;
  display:flex;
  flex-direction:column;
  padding:8px 10px;
  overflow:hidden;
  position:relative;
  z-index:1
}

#bgCards{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden
}

.bgCard{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  line-height:1;
  will-change:transform;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  pointer-events:none
}

/* Four independent random motions — no ordered rising column. Base rotation comes from --rot. */

@keyframes floatA{
  from{
    transform:translate(0,-30px) rotate(calc(var(--rot,0deg) - 6deg))
  }

  to{
    transform:translate(0,30px) rotate(calc(var(--rot,0deg) + 6deg))
  }
}

@keyframes floatB{
  from{
    transform:translate(-40px,0) rotate(var(--rot,0deg))
  }

  to{
    transform:translate(40px,0) rotate(var(--rot,0deg))
  }
}

@keyframes floatC{
  from{
    transform:rotate(calc(var(--rot,0deg) - 12deg)) scale(.9)
  }

  to{
    transform:rotate(calc(var(--rot,0deg) + 12deg)) scale(1.1)
  }
}

@keyframes floatD{
  from{
    transform:translate(-28px,-28px) rotate(calc(var(--rot,0deg) - 5deg))
  }

  to{
    transform:translate(28px,28px) rotate(calc(var(--rot,0deg) + 5deg))
  }
}

@media(max-width:600px){
  .screen{
    padding:10px
  }

  .card{
    height:60px
  }
}

@media(max-width:380px){
  .card{
    height:54px
  }
}
